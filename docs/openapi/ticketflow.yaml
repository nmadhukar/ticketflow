openapi: 3.1.0
info:
  title: Ticketflow scoped HTTP API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: First-release contract for authentication, tickets, AI, knowledge,
    provider configuration, and MCP transport. Other legacy REST endpoints and
    WebSocket upgrades are outside this document. Provider-neutral endpoints are
    introduced by the OpenRouter migration; Bedrock-named endpoints remain
    compatibility routes.
servers:
  - url: /
    description: Same origin as Ticketflow UI
tags:
  - name: Authentication
    description: Account and session management.
  - name: Tickets
    description: Ticket creation, updates, history, and comments.
  - name: Attachments
    description: Ticket attachment upload and download.
  - name: AI
    description: Model-assisted ticket and chat operations.
  - name: Chat
    description: Chat sessions and messages.
  - name: Knowledge
    description: Knowledge base search and article management.
  - name: Configuration
    description: AI provider and AWS storage settings.
  - name: MCP
    description: MCP JSON-RPC transport.
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: POST /api/auth/register
      operationId: op1_post__api_auth_register
      description: ""
      security: []
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  message:
                    type: string
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required or invalid bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated caller lacks permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found or outside visible scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                inviteToken:
                  type: string
              required:
                - email
                - password
                - firstName
                - lastName
              additionalProperties: true
