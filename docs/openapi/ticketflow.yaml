  /api/mcp:
    post:
      tags:
        - MCP
      summary: Streamable HTTP MCP JSON-RPC endpoint
      operationId: op69_post__api_mcp
      description: "Stateless MCP transport. POST JSON-RPC 2.0 requests with
        Authorization: Bearer <Ticketflow API key>. Key must carry mcp:tickets.
        Session cookies and JWTs are rejected. Each request gets a fresh server
        and transport; no MCP session ID. Use initialize then tools/list and
        tools/call inside JSON-RPC envelopes. This operation describes
        transport, not separate REST tool URLs."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: JSON-RPC result or error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "202":
          description: Accepted MCP notification
        "400":
          description: Invalid JSON-RPC request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API key lacks mcp:tickets permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Only POST is accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Signed-in Express session cookie. Session cookie name comes from
        the session configuration.
    bearerAuth:
      type: http
      scheme: bearer
      description: REST bearer API key or, when enabled, JWT. Bearer access is
        restricted to /api/tasks/** and /api/auth/user; MCP requires an API key
        with mcp:tickets.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: true
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        mustChangePassword:
          type: boolean
      additionalProperties: true
    Ticket:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type:
            - string
            - "null"
        status:
          type: string
        priority:
