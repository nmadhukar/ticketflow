version: "3.9"
services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ticketflow_user} -d ${POSTGRES_DB:-ticketflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ticketflow-network
      # The agents service stores saved staff conversations here, as its own role in its own
      # `mastra` schema (scripts/db/provision-assistant-db.mjs), reaching it over this internal
      # network only.
      - assistant

  # Build the image and run migrations before starting the app
  app:
    build: .
    image: ticketflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Schema before start (ruling R32): the hand-written idempotent migrations (0007+) first,
    # so drizzle-kit push has nothing of theirs left to create (push silently applies nothing
    # when it would have to ask a question); the server then refuses to boot if anything
    # required is still missing. `exec` makes node PID 1, so it receives SIGTERM from `docker stop`.
    command: sh -c "npm run db:migrate-sql && npm run db:push && exec node dist/index.js"
    environment:
      # Core runtime
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      # Use local postgres if DATABASE_URL not provided, otherwise use external
      # Default to local postgres service connection string
      DATABASE_URL: ${DATABASE_URL:-postgresql://ticketflow_user:ticketflow_password@postgres:5432/ticketflow}
      DB_DRIVER: ${DB_DRIVER:-pg}
      # PostgreSQL connection details (used if DATABASE_URL not set)
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      # Public origin of the site, e.g. https://tickets.example.com. REQUIRED in production:
      # emailed reset/invitation links, Teams card links and the SSO redirect are built from it
      # (never from the request's Host header), and the server refuses to boot without it (R34).
      APP_BASE_URL: ${APP_BASE_URL}

      # Optional (R36): id of the team that receives emailed tickets and customer tickets with
      # no user or team assignee. Blank: they stay admin-only until triaged. An id that names
      # no team is logged at startup and ignored.
      DEFAULT_TRIAGE_TEAM_ID: ${DEFAULT_TRIAGE_TEAM_ID:-}

      # Security & Auth
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # Bearer JWTs on the ticket API: off unless exactly "true" (R29). API keys need no switch.
      BEARER_JWT_ENABLED: ${BEARER_JWT_ENABLED:-false}
      # Managers may delete tickets only when "true" (admins always may).
      ALLOW_MANAGER_DELETE: ${ALLOW_MANAGER_DELETE:-false}

      # Inbound email (SES receipt rule -> SNS -> POST /api/email/inbound). Unset = refused (503).
      SNS_INBOUND_TOPIC_ARN: ${SNS_INBOUND_TOPIC_ARN:-}
      # Category of emailed tickets; unset or unknown = support.
      INBOUND_EMAIL_CATEGORY: ${INBOUND_EMAIL_CATEGORY:-}
      INBOUND_EMAIL_MAX_HEADER_BYTES: ${INBOUND_EMAIL_MAX_HEADER_BYTES:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-}

      # Microsoft 365 SSO from the environment (the admin panel's SSO settings take precedence).
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      # Role of a NEW SSO account: customer (default) or agent. It stays pending approval.
      SSO_DEFAULT_ROLE: ${SSO_DEFAULT_ROLE:-}

      # OpenRouter model calls use a server-only key. Leave blank to keep AI unavailable.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # AWS credentials from the environment remain for S3 attachments and SES email.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_CREDENTIALS_CREATED: ${AWS_CREDENTIALS_CREATED:-}

      # First-run admin (created only when no admin exists) and demo data gate
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}

      # CORS
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-false}

      # Rate limiting
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-600}
      # Proxies in front of the app (R49): 1 behind nginx alone, 2 behind Coolify/Traefik plus nginx.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Teams incoming webhooks are OFF unless this is exactly "true" (R84).
      TEAMS_WEBHOOKS_ENABLED: ${TEAMS_WEBHOOKS_ENABLED:-}

      # Input validation
      INPUT_VALIDATION_ENABLED: ${INPUT_VALIDATION_ENABLED:-true}
      VALIDATION_STRICT_MODE: ${VALIDATION_STRICT_MODE:-true}

      COOKIE_SECURE: ${COOKIE_SECURE}

      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}

      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION}

      MAX_FILE_UPLOAD_SIZE_MB: ${MAX_FILE_UPLOAD_SIZE_MB}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST}
      MAX_REQUEST_SIZE_MB: ${MAX_REQUEST_SIZE_MB}
      # RSS limit (MB) of each document text extractor process; empty = default 384.
      DOCUMENT_EXTRACT_MAX_MB: ${DOCUMENT_EXTRACT_MAX_MB:-}

      MICROSOFT_REDIRECT_URL: ${MICROSOFT_REDIRECT_URL}

      # Debugging (optional)
      DEBUG: ${DEBUG:-}
      LOG_LEVEL: ${LOG_LEVEL:-}

      # In-app assistant (agents service below). Off unless exactly "true"; when on, the server
      # refuses to start without both secrets (see .env.example). ASSISTANT_SESSION_SECRET is
      # app-only and is never passed to the agents service.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      # "staff" for a rollout that starts with agents, managers and admins; "all" adds customers.
      ASSISTANT_AUDIENCE: ${ASSISTANT_AUDIENCE:-all}
      ASSISTANT_SESSION_SECRET: ${ASSISTANT_SESSION_SECRET:-}
      ASSISTANT_SESSION_SECRET_PREVIOUS: ${ASSISTANT_SESSION_SECRET_PREVIOUS:-}
      ASSISTANT_AGENT_SECRET: ${ASSISTANT_AGENT_SECRET:-}
      ASSISTANT_AGENT_SECRET_PREVIOUS: ${ASSISTANT_AGENT_SECRET_PREVIOUS:-}
      ASSISTANT_RUN_MAX_SECONDS: ${ASSISTANT_RUN_MAX_SECONDS:-}
      # Internal listener for the agents service only: not published, not proxied by nginx.
      ASSISTANT_INTERNAL_PORT: 5100
      ASSISTANT_INTERNAL_HOST: 0.0.0.0
      ASSISTANT_AGENT_URL: http://agents:4111
      # Saved staff conversations; also set on the agents service (same value). Provision the
      # database role first: docs/deployment/ASSISTANT_DB.md.
      ASSISTANT_STAFF_HISTORY: ${ASSISTANT_STAFF_HISTORY:-false}
    restart: unless-stopped
    networks:
      - ticketflow-network
      - assistant

  # In-app assistant: the Mastra sidecar (agents/). Standby (health check only) unless
  # ASSISTANT_ENABLED=true. No published port: only the app reaches it, over the internal
  # `assistant` network; `agents-egress` is its route to the model provider. It is not on
  # ticketflow-network, so containers attached there (DSH) cannot reach it.
  agents:
    build:
      context: ./agents
      target: production
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_AGENT_SECRET: ${ASSISTANT_AGENT_SECRET:-}
      ASSISTANT_AGENT_SECRET_PREVIOUS: ${ASSISTANT_AGENT_SECRET_PREVIOUS:-}
      ASSISTANT_MCP_URL: http://app:5100/internal/mcp
      ASSISTANT_MODEL_PROVIDER: ${ASSISTANT_MODEL_PROVIDER:-openrouter}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-openai/gpt-5-mini}
      ASSISTANT_SUPPORT_MODEL: ${ASSISTANT_SUPPORT_MODEL:-}
      ASSISTANT_STAFF_MODEL: ${ASSISTANT_STAFF_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Saved staff conversations (off unless "true", the app's value): the assistant role's URL,
      # never the app's DATABASE_URL. See docs/deployment/ASSISTANT_DB.md.
      ASSISTANT_STAFF_HISTORY: ${ASSISTANT_STAFF_HISTORY:-false}
      MASTRA_DATABASE_URL: ${MASTRA_DATABASE_URL:-}
      ASSISTANT_HISTORY_RETENTION_DAYS: ${ASSISTANT_HISTORY_RETENTION_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4111/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - assistant
      - agents-egress

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      # - "443:443"  # enable after TLS is set up
    environment:
      - SERVER_NAME=${SERVER_NAME:-_}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # - ./certs:/etc/ssl/private:ro  # if using manual TLS
    restart: unless-stopped
    networks:
      - ticketflow-network

volumes:
  postgres_data:
    driver: local

networks:
  ticketflow-network:
    driver: bridge
  # app <-> agents only. internal: no route in or out of this network.
  assistant:
    driver: bridge
    internal: true
  # The agents service's route to the model provider; nothing else joins it.
  agents-egress:
    driver: bridge
